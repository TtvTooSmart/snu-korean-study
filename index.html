<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Korean Study for SNU students. Practise textbook vocabulary and grammar, chapter by chapter.">
  <title>Korean Study — For SNU students</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a href="#home" class="brand"><span class="brand-mark" lang="ko">한</span><span>Korean Study</span></a>
    <nav aria-label="Main navigation">
      <a href="#home" data-account-only hidden>Study</a><a href="#import" id="admin-import-link" hidden>Import & backup</a><a href="#students" id="admin-students-link" hidden>Students</a><a href="#settings" data-account-only hidden>Settings</a>
    </nav>
    <div class="header-controls">
      <label class="theme-switch"><span>Theme</span><select id="theme-select"><option value="green">Green</option><option value="black">Black</option><option value="white">White</option><option value="autumn">Autumn</option></select></label>
    </div>
  </header>
  <div id="warning" role="status"></div>
  <section id="study-progress" class="study-progress" aria-label="Study progress"></section>
  <main id="app" tabindex="-1"><p>Loading your books…</p></main>
  <footer>작은 연습, 큰 변화 · A little practice, every day.<br>Unofficial personal study companion<br><span>Made with boredom, By Shivam J</span><br><button id="toggle-leaves" class="secondary" hidden>Pause leaves</button></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
